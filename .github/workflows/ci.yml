name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker-no-keys:
    # Proves the judges' path: one command, no .env, main screen with the "key not set" banner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test ! -f .env
      - run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: curl -fsS http://localhost:8000/api/status | grep not_set
      - run: curl -fsS http://localhost:8000/ | grep "Sarvam API key not set"
      - if: always()
        run: docker compose down -v
